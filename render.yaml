# Render Blueprint — Static Site (plan gratuito, sin spin-down).
# Conectar el repo en Render: New → Blueprint → seleccionar este repo.
services:
  - type: web
    name: pulso
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # SPA de una sola página: cualquier ruta desconocida sirve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
