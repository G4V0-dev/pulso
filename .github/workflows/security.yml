name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/web

jobs:
  secrets:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # v3 runs on Node 24. GITLEAKS_LICENSE is only required for
      # organisation-owned repos, not for a personal account.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # Advisory until the Next.js migration lands: Next 14 currently reports
      # 1 critical + 3 high advisories, so failing here would block every PR.
      # The workflow stays green and prints the report as a warning annotation.
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high || \
            echo "::warning::npm audit reports advisories in production deps (advisory mode)"
